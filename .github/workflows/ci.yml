name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global corepack
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: corepack pnpm test:e2e
      - run: corepack pnpm test:web-live
      - run: node scripts/run.mjs mobile export --platform all
      - run: node node_modules/@playwright/test/cli.js test --config playwright.candidate.config.ts
  database:
    runs-on: ubuntu-latest
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-ci-only
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global corepack
      - run: corepack pnpm install --frozen-lockfile
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash supabase/tests/run.sh
      - run: corepack pnpm test:connected
